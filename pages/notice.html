<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 | 위드케어 재가노인복지센터</title>
<meta name="description" content="위드케어 재가노인복지센터의 공지사항과 소식을 안내합니다.">
<link rel="icon" href="/brand_logo/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-setup.js"></script>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
</head>
<body class="bg-white text-ink">

<header id="site-header"></header>

<section class="page-hero text-white">
  <div class="mx-auto max-w-6xl px-5 sm:px-6 py-16 sm:py-20">
    <p class="text-xs text-cream/60">홈 &nbsp;/&nbsp; 고객지원 &nbsp;/&nbsp; <span class="text-cream/90">공지사항</span></p>
    <h1 class="mt-3 text-3xl sm:text-4xl font-bold">공지사항</h1>
    <p class="mt-3 text-cream/75">위드케어의 소식과 안내를 확인하세요.</p>
  </div>
</section>

<main class="mx-auto max-w-4xl px-5 sm:px-6 py-16 sm:py-20">
  <div id="noticeState" class="text-sm text-ink-mute py-8 text-center">공지사항을 불러오는 중입니다…</div>
  <ul id="noticeList" class="hidden divide-y divide-hairline border-y border-hairline"></ul>
</main>

<footer id="site-footer"></footer>
<script src="/js/site.js"></script>
<script>
(function () {
  var C = window.SITE_CONFIG || {};
  var listEl = document.getElementById('noticeList');
  var stateEl = document.getElementById('noticeState');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]; }); }
  function badgeClass(cat) {
    return cat === '서비스' ? 'bg-sage/20 text-sage-dark' : 'bg-primary/10 text-primary-deep';
  }
  function render(items) {
    if (!items.length) { stateEl.textContent = '등록된 공지사항이 없습니다.'; return; }
    listEl.innerHTML = items.map(function (n) {
      var d = new Date(n.created_at);
      var ds = isNaN(d) ? '' : d.toLocaleDateString('ko-KR');
      return '<li class="py-5"><div class="flex items-start gap-3">' +
        '<span class="mt-0.5 inline-flex flex-shrink-0 rounded-md ' + badgeClass(n.category) + ' text-xs font-semibold px-2 py-1">' + esc(n.category) + '</span>' +
        '<div><p class="font-semibold text-ink">' + (n.pinned ? '<span class="text-primary-deep">[공지] </span>' : '') + esc(n.title) + '</p>' +
        '<p class="mt-1 text-sm text-ink-secondary whitespace-pre-wrap">' + esc(n.body) + '</p>' +
        '<p class="mt-2 text-xs text-ink-mute">' + ds + '</p></div></div></li>';
    }).join('');
    stateEl.classList.add('hidden');
    listEl.classList.remove('hidden');
  }
  if (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY) { stateEl.textContent = '등록된 공지사항이 없습니다.'; return; }
  fetch(C.SUPABASE_URL + '/rest/v1/notices?select=category,title,body,pinned,created_at&published=eq.true&order=pinned.desc,created_at.desc', {
    headers: { apikey: C.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY },
  })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (data) { render(Array.isArray(data) ? data : []); })
    .catch(function () { stateEl.textContent = '공지사항을 불러오지 못했습니다.'; });
})();
</script>
</body>
</html>
