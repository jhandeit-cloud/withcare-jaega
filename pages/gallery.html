<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갤러리 | 위드케어 재가노인복지센터</title>
<meta name="description" content="위드케어 재가노인복지센터의 활동 모습을 사진으로 만나보세요.">
<link rel="icon" href="/brand_logo/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/js/tailwind-setup.js"></script>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
</head>
<body class="bg-paper text-ink">

<header id="site-header"></header>

<section class="page-hero text-white">
  <div class="mx-auto max-w-6xl px-5 sm:px-6 py-14 sm:py-20">
    <p class="text-[13px] tracking-wide text-cream/55">홈 <span class="mx-1.5 text-cream/25">/</span> <span class="text-accent-soft">갤러리</span></p>
    <h1 class="mt-4 text-display-xl font-bold text-white">갤러리</h1>
    <p class="mt-4 text-cream/70 text-lead max-w-2xl">위드케어의 따뜻한 순간들을 기록합니다.</p>
  </div>
</section>

<main class="mx-auto max-w-6xl px-5 sm:px-6 section section-tight-top">
  <div id="galleryState" class="text-sm text-ink-mute py-8 text-center">사진을 불러오는 중입니다…</div>
  <div id="galleryGrid" class="hidden grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
</main>

<!-- 라이트박스 -->
<div id="lightbox" class="hidden fixed inset-0 z-[70] bg-ink/80 flex items-center justify-center p-6" role="dialog">
  <button type="button" class="absolute top-4 right-4 h-11 w-11 rounded-full bg-white/10 text-white text-xl" aria-label="닫기">✕</button>
  <figure class="max-w-4xl">
    <img id="lightboxImg" src="" alt="" class="max-h-[80vh] w-auto rounded-xl">
    <figcaption id="lightboxCap" class="mt-3 text-center text-sm text-white/80"></figcaption>
  </figure>
</div>

<footer id="site-footer"></footer>
<script src="/js/site.js"></script>
<script>
(function () {
  var C = window.SITE_CONFIG || {};
  var grid = document.getElementById('galleryGrid');
  var state = document.getElementById('galleryState');
  var lb = document.getElementById('lightbox');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function url(p) { return C.SUPABASE_URL + '/storage/v1/object/public/gallery/' + p; }
  function render(items) {
    if (!items.length) { state.textContent = '등록된 사진이 없습니다.'; return; }
    grid.innerHTML = items.map(function (g) {
      return '<figure class="card-hover rounded-2xl overflow-hidden border border-hairline bg-white shadow-card cursor-zoom-in" data-src="' + esc(url(g.image_path)) + '" data-cap="' + esc(g.title) + '">' +
        '<div class="aspect-[4/3] bg-canvas-soft"><img src="' + esc(url(g.image_path)) + '" alt="' + esc(g.title) + '" loading="lazy" class="w-full h-full object-cover"></div>' +
        (g.title ? '<figcaption class="p-4 text-sm text-ink-secondary">' + esc(g.title) + '</figcaption>' : '') +
      '</figure>';
    }).join('');
    state.classList.add('hidden');
    grid.classList.remove('hidden');
  }
  grid.addEventListener('click', function (e) {
    var f = e.target.closest('[data-src]'); if (!f) return;
    document.getElementById('lightboxImg').src = f.dataset.src;
    document.getElementById('lightboxCap').textContent = f.dataset.cap || '';
    lb.classList.remove('hidden');
  });
  lb.addEventListener('click', function () { lb.classList.add('hidden'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') lb.classList.add('hidden'); });

  if (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY) { state.textContent = '등록된 사진이 없습니다.'; return; }
  fetch(C.SUPABASE_URL + '/rest/v1/gallery_items?select=title,image_path&published=eq.true&order=sort_order.asc,created_at.desc', {
    headers: { apikey: C.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY },
  })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (d) { render(Array.isArray(d) ? d : []); })
    .catch(function () { state.textContent = '사진을 불러오지 못했습니다.'; });
})();
</script>
</body>
</html>
