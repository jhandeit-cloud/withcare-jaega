<!DOCTYPE html>
<html lang="ko">
<head>

<link rel="icon" href="/brand_logo/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body class="bg-white text-ink">

      <figcaption class="p-4 text-sm text-ink-secondary">나들이 동행</figcaption>

      <div class="aspect-[4/3] bg-gradient-to-br from-accent/20 to-cream flex items-center justify-center text-sm text-ink-mute">사진 준비 중</div>
      <figcaption class="p-4 text-sm text-ink-secondary">명절 위문</figcaption>

<footer id="site-footer"></footer>
<script src="/js/site.js"></script>
